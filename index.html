<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma page</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f3eee6;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .page {
            width: 700px;
            min-height: 900px;
            background-color: white;

            padding: 60px;
            box-sizing: border-box;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .message {
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="page">
        <div class="message">
            <h1>Message de test</h1>
            <p>Ma page fonctionne !</p>
        </div>
    </div>

</body>
</html>
